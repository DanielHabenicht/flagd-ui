<div class="project-list">
  <div class="project-content">
    <!-- @for (collection of collections(); track collection.id) { -->
    <div class="group-header">
      <!-- <mat-icon class="group-icon">{{ collection.icon }}</mat-icon> -->
      <span class="group-label">Collections</span>
      <!-- @if (collection.canSync) {
          <button
            mat-icon-button
            class="btn-sync-backend"
            (click)="syncBackend($event, collection.backendType, collection.backendUri)"
            title="Sync backend"
          >
            <mat-icon>sync</mat-icon>
          </button>
        } -->
      <!-- @if (collection.canRemove) {
          <button
            mat-icon-button
            class="btn-remove-backend"
            (click)="removeBackend($event, collection.backendType, collection.backendUri, collection.label)"
            title="Remove backend"
          >
            <mat-icon>close</mat-icon>
          </button>
        } -->
    </div>
    <mat-nav-list class="group-list">
      @for (entry of collections(); track entry.id) {
        <a
          mat-list-item
          [routerLink]="getFlagsFileRoute(entry)"
          queryParamsHandling="merge"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <span matListItemTitle class="project-title-row">
            <span class="project-name">{{ entry.name }}</span>
          </span>
          <button
            mat-icon-button
            matListItemMeta
            (click)="deleteCollection($event, entry)"
            title="Delete"
            class="btn-delete"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </a>
      }
    </mat-nav-list>
    <!-- } -->
  </div>

  <div class="sidebar-footer">
    <mat-divider></mat-divider>
    <div class="footer-actions">
      <div class="drop-hint">
        <mat-icon class="drop-hint-icon">upload_file</mat-icon>
        <span>Drop <code>.flagd.json</code> files anywhere or</span>
      </div>
      <button
        mat-flat-button
        class="new-flag-button"
        (click)="openNewFlagsFileDialog()"
        title="Add flag file"
      >
        <mat-icon>add</mat-icon>
        <span>Create flags-file</span>
      </button>
      <div class="footer-links">
        <a
          class="footer-link"
          href="https://github.com/DanielHabenicht/flagd-ui"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open GitHub repository"
        >
          <span>GitHub</span>
          <mat-icon>open_in_new</mat-icon>
        </a>
        <a
          class="footer-link"
          href="https://danielhabenicht.github.io/flagd-ui/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open documentation"
        >
          <span>Docs</span>
          <mat-icon>open_in_new</mat-icon>
        </a>
      </div>
    </div>
  </div>
</div>
