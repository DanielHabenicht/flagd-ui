  #   command: [ '--uri', 'file:./flags/demo.flagd.json' ]

  flagd:
    image: ghcr.io/open-feature/flagd:latest
    depends_on:
      azurite:
        condition: service_started
      azurite-init:
        condition: service_completed_successfully
    environment:
      - AZURE_STORAGE_ACCOUNT=devstoreaccount1
      - AZURE_STORAGE_KEY=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      - AZURE_STORAGE_IS_LOCAL_EMULATOR=true
      - AZURE_STORAGE_PROTOCOL=https
      - AZURE_STORAGE_DOMAIN=azurite:10000
      - SSL_CERT_FILE=/certs/ca.pem
    volumes:
      - ./services/azurite/certs/ca.pem:/certs/ca.pem:ro
    command:
      ['start', '--uri', 'azblob://feature-flags/demo.flagd.json']
    ports:
      - '8013:8013'
      - '8016:8016'
      - '8014:8014'

  azurite:
    image: local-azurite:latest
    build:
      context: services/azurite
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
    volumes:
      - ./services/azurite/azurite-store:/data
      - ./services/azurite/azurite-logs:/logs

  azurite-init:
    image: mcr.microsoft.com/azure-cli:2.81.0
    depends_on:
      - azurite
    volumes:
      - ./services/azurite/init.sh:/workdir/init.sh:ro
      - ./flags/demo.flagd.json:/workdir/demo.flagd.json
    working_dir: /workdir
    command: ['sh', '/workdir/init.sh']
